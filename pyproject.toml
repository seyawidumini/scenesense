[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scenesense"
version = "0.1.0"
description = "Playable AI detective mystery and reproducible evaluation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "psutil",
    "ruff",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cases*", "engine*", "agents*", "retrieval*", "ml*", "llm*", "api*", "scenebench*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
